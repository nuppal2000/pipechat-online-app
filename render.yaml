services:
  - type: web
    name: pipechat-online-app
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PIPECHAT_MODEL
        value: gpt-4.1-mini
      - key: PIPECHAT_FREE_CHAT_LIMIT
        value: "1000"
      - key: PIPECHAT_DATA_DIR
        value: /var/data/pipechat
    disk:
      name: pipechat-data
      mountPath: /var/data
      sizeGB: 1
